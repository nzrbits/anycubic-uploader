name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller packaging/windows.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: anycubic-uploader-windows
          path: dist/AnycubicUploader.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: pyinstaller packaging/macos.spec

      - name: Zip macOS app
        run: |
          cd dist
          zip -r AnycubicUploader-macOS.zip "Anycubic Uploader.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: anycubic-uploader-macos
          path: dist/AnycubicUploader-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/anycubic-uploader-windows/AnycubicUploader.exe
            artifacts/anycubic-uploader-macos/AnycubicUploader-macOS.zip
          generate_release_notes: true
          draft: false
