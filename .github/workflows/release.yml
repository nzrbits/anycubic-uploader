name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pyinstaller>=6,<7"

      - name: Run tests
        run: python -m pytest -rs

      - name: Build Windows executable
        run: pyinstaller packaging/windows.spec

      - name: Build and verify Windows setup
        run: |
          ./packaging/build-windows-installer.ps1
          ./packaging/verify-windows-installer.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: anycubic-uploader-windows
          path: |
            dist/AnycubicUploader.exe
            dist/AnycubicUploader-Setup.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pyinstaller>=6,<7"

      - name: Run tests
        run: python -m pytest -rs

      - name: Build macOS app
        run: pyinstaller packaging/macos.spec

      - name: Build and verify macOS installer
        run: |
          bash packaging/build-macos-installer.sh
          bash packaging/verify-macos-installer.sh

      - name: Zip macOS app
        if: matrix.arch == 'arm64'
        run: |
          cd dist
          zip -r AnycubicUploader-macOS.zip "Anycubic Uploader.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: anycubic-uploader-macos-${{ matrix.arch }}
          path: |
            dist/AnycubicUploader-macOS-${{ matrix.arch }}.pkg
            dist/AnycubicUploader-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/anycubic-uploader-windows/AnycubicUploader.exe
            artifacts/anycubic-uploader-windows/AnycubicUploader-Setup.exe
            artifacts/anycubic-uploader-macos-arm64/AnycubicUploader-macOS.zip
            artifacts/anycubic-uploader-macos-arm64/AnycubicUploader-macOS-arm64.pkg
            artifacts/anycubic-uploader-macos-x86_64/AnycubicUploader-macOS-x86_64.pkg
          generate_release_notes: true
          draft: false
